<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGI Test — http-server</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #eef2f7;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 44px 52px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #6c7be8;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 12px;
            margin-top: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            font-family: inherit;
            font-size: 14px;
            color: #1a1a2e;
            border: 1px solid #e4e4e4;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 14px;
            outline: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #6c7be8;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: #6c7be8;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px 24px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #5a6ad6; }

        .divider {
            border: none;
            border-top: 1px solid #ebebeb;
            margin: 28px 0;
        }

        a {
            font-size: 14px;
            color: #6c7be8;
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="label">http-server</div>
        <h1>CGI Test</h1>
        <p class="subtitle">Test the echo CGI script with GET and POST methods.</p>

        <div class="section-title">GET</div>
        <form action="/cgi-bin/echo.py" method="GET">
            <label>Query string (key=value)</label>
            <input type="text" name="message" placeholder="hello">
            <button type="submit">Send GET</button>
        </form>

        <div class="section-title">POST</div>
        <form action="/cgi-bin/echo.py" method="POST">
            <label>Body</label>
            <textarea name="body" placeholder="type something..."></textarea>
            <button type="submit">Send POST</button>
        </form>

        <hr class="divider">
        <a href="/">Back to home</a>
    </div>
</body>
</html>
