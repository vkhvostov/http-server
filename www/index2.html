<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>http-server — Server 2</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #eef2f7;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 44px 52px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #6c7be8;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.7;
        }

        a {
            color: #6c7be8;
            text-underline-offset: 3px;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="label">http-server</div>
        <h1>Welcome to the second server of http-server</h1>
        <p>Another instance of http-server running on a different port.</p>
    </div>
</body>
</html>
