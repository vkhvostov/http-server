<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>http-server</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #eef2f7;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 44px 52px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #6c7be8;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 10px;
            margin-top: 24px;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        ul li a {
            font-size: 14px;
            color: #6c7be8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        ul li a:hover { text-decoration: underline; }

        .note {
            font-size: 12px;
            color: #9ca3af;
            margin-left: 4px;
        }

        .divider {
            border: none;
            border-top: 1px solid #ebebeb;
            margin: 24px 0 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="label">http-server</div>
        <h1>Welcome to http-server</h1>
        <p class="subtitle">Just an educational project.</p>

        <div class="section-title">Files</div>
        <ul>
            <li><a href="/upload.html">Upload a file</a></li>
            <li><a href="/uploads/">View uploaded files</a></li>
        </ul>

        <div class="section-title">CGI tests</div>
        <ul>
            <li><a href="/cgi-bin/hello.py">hello.py <span class="note">— basic hello</span></a></li>
            <li><a href="/cgi-test.html">echo.py <span class="note">— test GET &amp; POST</span></a></li>
            <li><a href="/cgi-bin/slow.py">slow.py <span class="note">— sleeps 15s, triggers 504</span></a></li>
            <li><a href="/cgi-bin/crash.py">crash.py <span class="note">— exits 1, triggers 500</span></a></li>
        </ul>

        <hr class="divider">
    </div>
</body>
</html>
